[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novotax"
version = "1.1.8"
description = "NovoTax: sample-specific database construction for prokaryotic mass spectrometry-based proteomics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Dennis Svedberg" }
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "matplotlib>=3.9.1",
  "requests>=2.32.3",
  "tqdm>=4.67.1"
]

[project.scripts]
novotax = "NovoTax.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["NovoTax*"]
